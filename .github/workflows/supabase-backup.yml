name: Supabase Daily Backup to GCS

on:
  schedule:
    - cron: '0 0 * * *' # Todos los días a medianoche UTC
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  backup:
    name: Backup and Upload
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          # Instalamos una versión estable de la CLI de Supabase
          curl -L https://github.com/supabase/cli/releases/download/v1.191.3/supabase_linux_amd64.tar.gz -o supabase.tar.gz
          tar -xzf supabase.tar.gz
          sudo mv supabase /usr/local/bin/
          supabase --version

      - name: Dump Database
        env:
          # Requiere la URL de conexión directa (ej: postgresql://postgres:[password]@db.[project-ref].supabase.co:5432/postgres)
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Iniciando volcado de la base de datos..."
          supabase db dump --db-url "$DB_URL" -f backup.sql
          echo "Volcado completado."

      - name: Encrypt Backup (AES-256)
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          echo "Encriptando backup..."
          gpg --batch --yes --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o backup.sql.gpg backup.sql
          echo "Encriptación completada."
          # Eliminamos el archivo original por seguridad
          rm backup.sql

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_SA_KEY }}

      - name: Upload to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: backup.sql.gpg
          # El bucket debe existir previamente
          destination: ${{ secrets.GCS_BUCKET }}/backups/$(date +'%Y-%m-%d')/
          parent: false

      - name: Verify Upload
        run: echo "Respaldo subido exitosamente a Google Cloud Storage."
